services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: "3000"
      # Manifest URLs must be https or large downloads break behind proxies
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"
      ADMIN_USER: admin
      ADMIN_PASS: "changeme"
    volumes:
      - appstore-uploads:/app/uploads
      - appstore-data:/app/data
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/apps.json').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  appstore-uploads:
  appstore-data:
