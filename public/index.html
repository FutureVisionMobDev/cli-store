<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JKSTORE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f2f2f7;
      --surface: #ffffff;
      --ink: #1c1c1e;
      --secondary: #3a3a3c;
      --muted: #8e8e93;
      --line: #d1d1d6;
      --blue: #0071e3;
      --blue-press: #0077ed;
      --green: #34c759;
      --font: "DM Sans", system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    /* top bar */
    .top {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: saturate(180%) blur(16px);
      background: rgba(242, 242, 247, 0.82);
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .top-inner {
      width: min(980px, calc(100% - 32px));
      margin: 0 auto;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .logo {
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.03em;
      color: var(--ink);
      text-decoration: none;
    }
    .logo em {
      font-style: normal;
      color: var(--blue);
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .link {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--blue);
      text-decoration: none;
      padding: 8px 10px;
    }
    .link:hover { opacity: 0.8; }
    .link.muted { color: var(--muted); }

    .page {
      width: min(980px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 80px;
    }

    /* page title */
    .page-title {
      margin: 8px 0 6px;
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      font-weight: 700;
      letter-spacing: -0.035em;
    }
    .page-sub {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    /* filters */
    .filters {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .filter {
      border: 0;
      background: transparent;
      color: var(--secondary);
      font-family: var(--font);
      font-size: 0.88rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 980px;
      cursor: pointer;
    }
    .filter[aria-pressed="true"] {
      background: var(--ink);
      color: #fff;
    }
    .filter:hover:not([aria-pressed="true"]) {
      background: rgba(0,0,0,0.05);
    }

    /* listing panel */
    .panel {
      background: var(--surface);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 1px 0 rgba(0,0,0,0.04);
    }

    .app {
      border-bottom: 1px solid var(--line);
    }
    .app:last-child { border-bottom: 0; }

    .app-main {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      padding: 18px 20px;
      cursor: pointer;
      transition: background 120ms ease;
    }
    .app-main:hover { background: #fafafa; }

    .icon {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 1.55rem;
      letter-spacing: -0.04em;
      color: #fff;
      user-select: none;
    }

    .info { min-width: 0; }
    .name {
      margin: 0;
      font-size: 1.12rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .desc {
      margin: 3px 0 0;
      font-size: 0.88rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .facts {
      margin: 6px 0 0;
      display: flex;
      flex-wrap: wrap;
      gap: 0 10px;
      font-size: 0.78rem;
      color: var(--secondary);
    }
    .facts span::before {
      content: "·";
      margin-right: 10px;
      color: var(--line);
    }
    .facts span:first-child::before { content: none; margin: 0; }

    .get {
      border: 0;
      background: #e8e8ed;
      color: var(--blue);
      font-family: var(--font);
      font-weight: 700;
      font-size: 0.82rem;
      letter-spacing: 0.01em;
      text-transform: uppercase;
      border-radius: 980px;
      padding: 8px 18px;
      min-width: 72px;
      cursor: pointer;
    }
    .get:hover { background: #dcdcde; }
    .app.open .get {
      background: var(--blue);
      color: #fff;
    }

    /* expand install panel */
    .detail {
      display: none;
      padding: 0 20px 20px 108px;
      background: #fafafa;
      border-top: 1px solid var(--line);
    }
    .app.open .detail { display: block; }
    .detail-label {
      margin: 14px 0 8px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .cmd {
      display: grid;
      grid-template-columns: 64px 1fr auto;
      gap: 10px;
      align-items: start;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 12px;
      margin-bottom: 8px;
    }
    .cmd:last-child { margin-bottom: 0; }
    .os {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--secondary);
      padding-top: 2px;
    }
    .cmd code {
      font-family: var(--mono);
      font-size: 0.74rem;
      line-height: 1.45;
      color: var(--ink);
      word-break: break-all;
    }
    .copy {
      border: 0;
      background: transparent;
      color: var(--blue);
      font-family: var(--font);
      font-weight: 650;
      font-size: 0.78rem;
      cursor: pointer;
      padding: 2px 6px;
      white-space: nowrap;
    }

    .empty {
      padding: 48px 24px;
      text-align: center;
      color: var(--muted);
    }

    /* cli strip under list */
    .howto {
      margin-top: 28px;
      padding: 20px 22px;
      background: var(--surface);
      border-radius: 16px;
    }
    .howto h2 {
      margin: 0 0 4px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .howto p {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 0.88rem;
    }
    .howto-grid {
      display: grid;
      gap: 8px;
    }
    @media (min-width: 720px) {
      .howto-grid { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 560px) {
      .app-main {
        grid-template-columns: 56px minmax(0, 1fr);
        grid-template-areas:
          "icon info"
          "icon get";
        gap: 10px 14px;
      }
      .icon { width: 56px; height: 56px; font-size: 1.25rem; border-radius: 13px; grid-area: icon; }
      .info { grid-area: info; }
      .get { grid-area: get; justify-self: start; }
      .detail { padding-left: 20px; }
      .facts { display: none; }
    }
  </style>
</head>
<body>
  <div class="top">
    <div class="top-inner">
      <a class="logo" href="/">JK<em>STORE</em></a>
      <div class="top-actions">
        <a class="link muted" href="/apps.json">JSON</a>
        <a class="link" href="/admin">Admin</a>
      </div>
    </div>
  </div>

  <main class="page">
    <h1 class="page-title">Apps</h1>
    <p class="page-sub" id="summary">Loading catalog…</p>

    <div class="filters" role="tablist" aria-label="Platform filter">
      <button type="button" class="filter" data-filter="all" aria-pressed="true">All</button>
      <button type="button" class="filter" data-filter="mac" aria-pressed="false">Mac</button>
      <button type="button" class="filter" data-filter="win" aria-pressed="false">Windows</button>
    </div>

    <div class="panel" id="panel">
      <div class="empty" id="empty">Loading…</div>
    </div>

    <section class="howto">
      <h2>Install the CLI first</h2>
      <p>Then pick an app above for a direct install command — or run the menu.</p>
      <div class="howto-grid">
        <div class="cmd">
          <span class="os">Win</span>
          <code>irm https://appstore.fvcloud.online | iex</code>
          <button type="button" class="copy" data-copy="irm https://appstore.fvcloud.online | iex">Copy</button>
        </div>
        <div class="cmd">
          <span class="os">Mac</span>
          <code>curl -fsSL https://appstore.fvcloud.online | bash</code>
          <button type="button" class="copy" data-copy="curl -fsSL https://appstore.fvcloud.online | bash">Copy</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const STORE = location.origin;
    const panel = document.getElementById("panel");
    const empty = document.getElementById("empty");
    const summary = document.getElementById("summary");
    let apps = [];
    let filter = "all";
    let openSlug = null;

    const PALETTES = [
      ["#0071e3", "#5ac8fa"],
      ["#34c759", "#30d158"],
      ["#ff9500", "#ffcc00"],
      ["#af52de", "#bf5af2"],
      ["#ff2d55", "#ff375f"],
      ["#5856d6", "#5e5ce6"],
      ["#00c7be", "#63e6e2"],
      ["#ff3b30", "#ff453a"],
    ];

    function hashHue(s) {
      let h = 0;
      for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
      return PALETTES[h % PALETTES.length];
    }

    function fmtSize(n) {
      n = Number(n) || 0;
      if (n <= 0) return "";
      if (n < 1024) return n + " B";
      if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
      if (n < 1024 * 1024 * 1024) return (n / (1024 * 1024)).toFixed(1) + " MB";
      return (n / (1024 * 1024 * 1024)).toFixed(2) + " GB";
    }

    function copyText(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        const prev = btn.textContent;
        btn.textContent = "Copied";
        setTimeout(() => { btn.textContent = prev; }, 1100);
      }).catch(() => { btn.textContent = "Fail"; });
    }

    document.querySelectorAll("[data-copy]").forEach((btn) => {
      btn.addEventListener("click", () => copyText(btn.getAttribute("data-copy"), btn));
    });

    document.querySelectorAll(".filter").forEach((btn) => {
      btn.addEventListener("click", () => {
        filter = btn.getAttribute("data-filter");
        document.querySelectorAll(".filter").forEach((b) =>
          b.setAttribute("aria-pressed", b === btn ? "true" : "false")
        );
        render();
      });
    });

    function visibleApps() {
      return apps.filter((a) => {
        if (filter === "mac") return a.hasMac;
        if (filter === "win") return a.hasWin;
        return true;
      });
    }

    function render() {
      const list = visibleApps();
      summary.textContent =
        apps.length === 0
          ? "No apps published yet."
          : list.length + " of " + apps.length + " app" + (apps.length === 1 ? "" : "s");

      if (!list.length) {
        panel.innerHTML = '<div class="empty">' +
          (apps.length ? "No apps for this filter." : "Catalog empty — publish from Admin.") +
          "</div>";
        return;
      }

      panel.innerHTML = "";
      list.forEach((a) => {
        const [c1, c2] = hashHue(a.slug);
        const isOpen = openSlug === a.slug;
        const facts = [];
        if (a.hasMac) facts.push("Mac");
        if (a.hasWin) facts.push("Windows");
        if (a.version) facts.push("v" + a.version);
        if (a.sizeLabel) facts.push(a.sizeLabel);
        if (a.source) facts.push(a.source);

        const el = document.createElement("article");
        el.className = "app" + (isOpen ? " open" : "");
        el.dataset.slug = a.slug;

        const main = document.createElement("div");
        main.className = "app-main";
        main.innerHTML =
          '<div class="icon" style="background:linear-gradient(145deg,' + c1 + ',' + c2 + ')">' +
            a.initial +
          "</div>" +
          '<div class="info">' +
            '<p class="name"></p>' +
            '<p class="desc"></p>' +
            '<div class="facts"></div>' +
          "</div>" +
          '<button type="button" class="get">' + (isOpen ? "Hide" : "Get") + "</button>";

        main.querySelector(".name").textContent = a.name;
        main.querySelector(".desc").textContent = a.description || a.slug;
        const factsEl = main.querySelector(".facts");
        facts.forEach((f) => {
          const s = document.createElement("span");
          s.textContent = f;
          factsEl.appendChild(s);
        });

        const getBtn = main.querySelector(".get");
        const toggle = () => {
          openSlug = openSlug === a.slug ? null : a.slug;
          render();
        };
        main.addEventListener("click", (e) => {
          if (e.target === getBtn) return;
          toggle();
        });
        getBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          toggle();
        });

        const detail = document.createElement("div");
        detail.className = "detail";
        detail.innerHTML = '<div class="detail-label">Install command</div>';

        if (a.hasMac) {
          const macCmd = "curl -fsSL " + STORE + "/install.sh | bash -s -- " + a.slug;
          const row = document.createElement("div");
          row.className = "cmd";
          row.innerHTML = '<span class="os">Mac</span><code></code><button type="button" class="copy">Copy</button>';
          row.querySelector("code").textContent = macCmd;
          row.querySelector(".copy").addEventListener("click", (e) => {
            e.stopPropagation();
            copyText(macCmd, e.currentTarget);
          });
          detail.appendChild(row);
        }
        if (a.hasWin) {
          const winCmd = "$env:JK_APP='" + a.slug + "'; irm " + STORE + "/install.ps1 | iex";
          const row = document.createElement("div");
          row.className = "cmd";
          row.innerHTML = '<span class="os">Win</span><code></code><button type="button" class="copy">Copy</button>';
          row.querySelector("code").textContent = winCmd;
          row.querySelector(".copy").addEventListener("click", (e) => {
            e.stopPropagation();
            copyText(winCmd, e.currentTarget);
          });
          detail.appendChild(row);
        }

        el.appendChild(main);
        el.appendChild(detail);
        panel.appendChild(el);
      });
    }

    fetch("/apps.json")
      .then((r) => {
        if (!r.ok) throw new Error("Could not load catalog");
        return r.json();
      })
      .then((data) => {
        apps = Object.keys(data || {})
          .sort((a, b) => {
            const na = (data[a].name || a).toLowerCase();
            const nb = (data[b].name || b).toLowerCase();
            return na.localeCompare(nb);
          })
          .map((slug) => {
            const e = data[slug];
            const hasMac = !!e.mac;
            const hasWin = !!e.win;
            const platform = e.mac || e.win || {};
            const size = Number(platform.size) || 0;
            return {
              slug,
              name: e.name || slug,
              description: (e.description || "").trim(),
              hasMac,
              hasWin,
              version: platform.version || "",
              sizeLabel: fmtSize(size),
              source: platform.source || "",
              initial: ((e.name || slug).trim()[0] || "?").toUpperCase(),
            };
          });
        render();
      })
      .catch((err) => {
        empty.textContent = err.message || "Failed to load";
        summary.textContent = "Catalog unavailable";
      });
  </script>
</body>
</html>
